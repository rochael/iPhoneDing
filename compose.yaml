services:
  app:
    build: .
    image: iphone-ding:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/iphone-ding.sqlite
      COOKIE_SECURE: "true"
    volumes:
      - inventory-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  monitor:
    image: iphone-ding:local
    restart: unless-stopped
    command: ["node", "dist/server/src/adapters/node-monitor.js"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/iphone-ding.sqlite
    volumes:
      - inventory-data:/app/data
    depends_on:
      app:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  inventory-data:
  caddy-data:
  caddy-config:
